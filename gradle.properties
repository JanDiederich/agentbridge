# IntelliJ Platform Configuration
# Set intellijPlatform.localPath in your local ~/.gradle/gradle.properties to use a local IDE installation.
# If unset, the Gradle plugin will download the configured IDE version automatically.
# Example: intellijPlatform.localPath=/path/to/your/IntelliJ-IDEA
# Gradle Configuration
# Set org.gradle.java.home in ~/.gradle/gradle.properties to point to a specific JDK.
# If unset, the JDK on PATH is used.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:G1PeriodicGCInterval=300000 -XX:+G1PeriodicGCInvokesConcurrent
org.gradle.parallel=true
org.gradle.caching=true
# Reclaim Gradle daemon memory after 15 min idle (default: 3h), reducing inactive_anon accumulation during long sessions
org.gradle.daemon.idletimeout=900000
# Kotlin Configuration (disable incremental compilation to avoid crashes in sandbox)
kotlin.incremental=false
kotlin.incremental.js=false
kotlin.incremental.multiplatform=false
# Exclude bundled plugins from the test IDE classpath. The defaults from IntelliJ Platform
# Gradle Plugin 2.18.1 (com.intellij.openRewrite, com.intellij.ja, com.intellij.ko,
# com.intellij.zh) are re-listed here because setting this property replaces the defaults.
# We add org.jetbrains.plugins.vue because its LSP static initializer (JSPluginPathManager
# → VueLspServerLoaderKt.<clinit>) crashes when idea-2026.1.3+ moves plugin resources out
# of lib/modules — see JetBrains/intellij-platform-gradle-plugin#2183 and WEB-78747.
# com.intellij.modules.ultimate registers a non-instantiable placeholder extension in the 262 test
# fixture; AgentBridge's unit tests do not depend on Ultimate-only APIs, so omit it as well.
# The listener is triggered by any VFS refresh in a test, so these exclusions are required for
# Debug/Editor/Find*/Refactoring/Quality tests to run at all.
org.jetbrains.intellij.platform.testIdeBundledPluginsClasspathExcludes=\
  com.intellij.openRewrite,\
  com.intellij.ja,\
  com.intellij.ko,\
  com.intellij.zh,\
  org.jetbrains.plugins.vue,\
  com.intellij.modules.ultimate
# Platform versions the real-IDE compatibility bench downloads (see ide-integration-tests module)
clionPlatformVersion=2026.1
riderPlatformVersion=2026.1
# IntelliJ Platform Version
# Both plugin-core and plugin-experimental compile against this version.
# The minimum *runtime* version is still 2025.3 (sinceBuild="253").
# 2025.3, 2026.1.x, 2026.2 and 2026.3 are all supported build targets: each release's jar layout
# needs different classpath requests, and the gates for that are resolved from this value — see
# IntelliJTargetBuild in buildSrc, and the comments in plugin-core/build.gradle.kts. CI compiles
# every supported release (ci.yml job "Build at IDE …").
# Write a release string ("2026.1.3", "2025.3", "2026.3") with no IDE-type prefix: the build scripts
# choose the IDE themselves, so a prefix ("IU-2026.2") leaves the Gradle plugin no resolvable
# download URL. Bare build numbers ("253.6.1", "263.7307.44-EAP") address preview channels.
# 2026.3 and newer ask for Java 25 source compatibility (verifyPluginProjectConfiguration warns);
# 21-compiled plugins still load there, so the build stays on the pinned toolchain.
intellijPlatformVersion=2026.1.3
# Dependency Versions
annotationsVersion=26.0.2
gsonVersion=2.13.1
rhinoVersion=1.7.15
junitVersion=5.11.4
junit4Version=4.13.2
mockitoVersion=5.23.0
jazzerVersion=0.22.0
sqliteJdbcVersion=3.51.3.0
zxingVersion=3.5.3
koogVersion=1.3.0
# Versions pinned to what the IntelliJ Platform Starter framework (testFramework(Starter))
# requires for the ide-integration-tests bench. These intentionally differ from the repo-wide
# junitVersion above: ide-starter-junit5 needs JUnit Jupiter 5.13.4 / Platform 1.13.4 — an older
# launcher causes an engine/API version mismatch at test-discovery time.
ideStarterJunitVersion=5.13.4
ideStarterJunitPlatformVersion=1.13.4
kodeinVersion=7.20.2
ideStarterCoroutinesVersion=1.10.2-intellij-1
